<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="neonCyanViolet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="500" height="500" rx="40" fill="#06070a" stroke="#7000ff" stroke-width="2" />
  
  <!-- Outer Glow Circle -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="url(#neonCyanViolet)" stroke-width="4" stroke-dasharray="15 8" opacity="0.6" />

  <!-- Dual Cyber Blade H Monogram -->
  <!-- Left Blade -->
  <path d="M 150 120 L 210 120 L 210 380 L 150 380 Z" fill="url(#neonCyanViolet)" filter="url(#neonGlow)" />
  <!-- Right Blade -->
  <path d="M 290 120 L 350 120 L 350 380 L 290 380 Z" fill="url(#neonCyanViolet)" filter="url(#neonGlow)" />
  <!-- Diagonal Dynamic Crossbar -->
  <path d="M 210 220 L 290 170 L 290 280 L 210 330 Z" fill="#00f0ff" opacity="0.95" filter="url(#neonGlow)" />
</svg>
