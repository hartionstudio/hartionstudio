<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070a" />
      <stop offset="100%" stop-color="#12141d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="500" height="500" rx="40" fill="url(#darkBg)" stroke="rgba(0, 240, 255, 0.2)" stroke-width="2" />
  
  <!-- Outer Hexagon Frame -->
  <polygon points="250,70 395,153 395,320 250,403 105,320 105,153" fill="none" stroke="url(#cyanViolet)" stroke-width="6" opacity="0.4" />

  <!-- Hexagonal Core Grid Lines -->
  <polygon points="250,95 373,166 373,308 250,379 127,308 127,166" fill="rgba(18,20,29,0.7)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- 3D Monogram H Lines -->
  <!-- Left Pillar -->
  <path d="M 160 160 L 205 135 L 205 340 L 160 315 Z" fill="url(#cyanViolet)" filter="url(#glow)" />
  <!-- Right Pillar -->
  <path d="M 295 160 L 340 135 L 340 315 L 295 340 Z" fill="url(#cyanViolet)" filter="url(#glow)" />
  <!-- Crossbar Prism -->
  <path d="M 205 220 L 295 220 L 295 260 L 205 260 Z" fill="#00f0ff" opacity="0.9" />
  <!-- Glowing Center Dot -->
  <circle cx="250" cy="240" r="14" fill="#ffffff" filter="url(#glow)" />
</svg>
